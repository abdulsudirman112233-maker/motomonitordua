name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project files
        run: |
          mkdir -p backup_manifest
          cp android/app/src/main/AndroidManifest.xml backup_manifest/AndroidManifest.xml || true
          flutter create --platforms=android --org com.example.gps_tracker_flutter .
          cp backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
