<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Vehicle IoT Tracker - Dashboard Pelacakan GPS dan Kontrol Keamanan Kendaraan Cerdas Berbasis Flutter">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Vehicle IoT Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Vehicle IoT Tracker & Security System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b0f19 70%);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-radius: 50%;
      border-top-color: #00f0ff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <div class="loading-title">SMART VEHICLE IOT TRACKER</div>
    <div class="loading-sub">Memuat Dashboard Pelacak GPS Real-Time...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
